<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="2" y="2" width="124" height="124" rx="22" fill="#1e2229" stroke="#353b46" stroke-width="4"/>
  <!-- closed molecule: four atoms bonded into a ring -->
  <g stroke="#e8ecf1" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M42 42 H86 V86 H42 Z"/>
  </g>
  <!-- stubs: each atom's connections point along the ring -->
  <circle cx="42" cy="42" r="15" fill="#6ab04c"/>
  <circle cx="86" cy="42" r="15" fill="#4a90d9"/>
  <circle cx="86" cy="86" r="15" fill="#e0a030"/>
  <circle cx="42" cy="86" r="15" fill="#c0504d"/>
  <!-- small highlights -->
  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="37" cy="37" r="4"/>
    <circle cx="81" cy="37" r="4"/>
    <circle cx="81" cy="81" r="4"/>
    <circle cx="37" cy="81" r="4"/>
  </g>
  <!-- spark: this molecule is about to vanish -->
  <g stroke="#ff9a3c" stroke-width="4" stroke-linecap="round">
    <path d="M64 56 V72 M56 64 H72"/>
  </g>
</svg>
